[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-auto"
version = "0.1.0"
description = "iOS Simulator automation for mobile app data extraction"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "Pillow>=9.0",
]

[project.scripts]
mobile-auto = "mobile_auto.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
